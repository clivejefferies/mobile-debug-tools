name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Set up debugger compilation JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile optional debugger worker
        run: javac --release 17 --add-modules jdk.jdi -d "$RUNNER_TEMP/mobile-debug-jdi" worker/DebuggerWorker.java
      - name: Check debugger package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/mobile-debug-package.json"
          node --input-type=module - "$RUNNER_TEMP/mobile-debug-package.json" <<'JS'
          import fs from 'node:fs'
          const files = new Set(JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))[0].files.map(file => file.path))
          for (const file of ['worker/DebuggerWorker.java', 'dist/debugger/worker.js', 'dist/server/debugger-schema.js']) {
            if (!files.has(file)) throw new Error(`Missing debugger package file: ${file}`)
          }
          JS
      - name: Run unit tests
        run: npm test

  android-integration:
    name: Android emulator integration (manual)
    runs-on: ubuntu-latest
    needs: unit
    # only run integration when manually triggered to avoid long runs on every PR
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install debugger fixture SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true

      - name: Build and run Android integration tests
        env:
          ADB_TIMEOUT: 120000
          MCP_DEBUGGER_DEVICE: emulator-5554
        run: npm run test:device
